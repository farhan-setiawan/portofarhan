name: Deploy React Vite

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.actor == 'farhan-setiawan'
    runs-on: self-hosted
    environtment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build

      - name: Deploy to Nginx VM
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            dist/ nginx-vm:/var/www/portofarhan/